kind = "web"
previewPath = "/"
title = "INDO DUTA TECH - Management System"
version = "1.0.0"
id = "artifacts/idt-management"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19070

[services.development]
run = "pnpm --filter @workspace/idt-management run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/idt-management", "run", "build" ]
serve = "static"
publicDir = "artifacts/idt-management/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19070"
BASE_PATH = "/"
